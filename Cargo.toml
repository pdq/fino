[package]
name = "fino"
version = "0.1.0"
edition = "2024"
publish = false
readme = "README.md"
repository = "https://github.com/pdqcom/fino"
description = "Declarative parallel pattern linter with violation snapshots"

[dependencies]
fancy-regex = "=0.20.0"
globset = "=0.4.17"
ignore = "=0.4.24"
rayon = "=1.11.0"
regex = "=1.12.2"
schemars = "=1.2.3"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
toml = "=0.8.23"
tree-sitter = "=0.25.10"
tree-sitter-elixir = "=0.3.5"
unicode-segmentation = "=1.13.3"

[patch.crates-io]
tree-sitter = { path = "vendor/tree-sitter" }
