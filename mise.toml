#:schema https://mise.jdx.dev/schema/mise.json

[tools]
"github:crate-ci/committed" = "1.1.12"
dprint = "0.64.3"
betterleaks = "1.10.0"
hk = "2.11.1"
pitchfork = "2.33.1"
rust = { version = "1.99.1", profile = "minimal", components = ["clippy", "rustfmt"] }
jactionlint = "2.4.0"

[hooks]
postinstall = 'test "${CI:-}" = true || hk install --mise'

[tasks.fmt]
description = "Formats all supported files"
run = ["cargo fmt --all", "dprint fmt"]

[tasks.fmt-check]
description = "Checks formatting and fails on differences"
run = ["cargo fmt --all --check", "dprint check"]

[tasks.build]
description = "Build Fino"
run = "cargo build --locked"

[tasks."build:release"]
description = "Build the optimized release binary"
run = "cargo build --release --locked"

[tasks.test]
description = "Run unit and CLI integration tests"
run = "cargo test --locked"

[tasks.package]
description = "Package a built release target for distribution"
run = "bash scripts/package.sh"

[tasks.clippy]
description = "Check Rust code without warnings"
run = "cargo clippy --locked --all-targets -- -D warnings"

[tasks."lint:workflows"]
description = "Lint GitHub Actions workflows with jactionlint"
run = "jactionlint"

[tasks."lint:commits"]
description = "Require Conventional Commits throughout reachable Git history"
run = "bash scripts/lint-commits.sh"

[tasks."secrets:files"]
description = "Scan working files without contacting credential providers"
run = "betterleaks dir . --redact --no-banner --validation=false --ignore-gitleaks-allow"

[tasks."secrets:history"]
description = "Scan all branches and tags, not just the current checkout"
run = "bash scripts/scan-history.sh"

[tasks.check]
description = "Run all local and CI quality gates"
depends = ["fmt-check", "clippy", "test", "lint:workflows", "secrets:files"]

[tasks.fix]
description = "Apply formatting fixes; secrets require manual review"
run = "hk fix --all"

[tasks."perf:run"]
description = "Build release artifacts and print synthetic performance samples (no baseline writes)"
usage = '''
arg "<runner>" help="Generic stable runner label, not a hostname"
arg "<profile>" help="Explicit measurement profile label"
flag "--binary <binary>" help="Existing optimized artifact" default="target/release/fino"
'''
run = '''
set -eu
cargo build --release --locked --bin fino --example performance
exec target/release/examples/performance run "${usage_runner?}" "${usage_profile?}" --binary "${usage_binary?}"
'''

[tasks."perf:snapshot"]
description = "Explicitly create or replace a host-specific performance baseline"
usage = '''
arg "<runner>" help="Generic stable runner label, not a hostname"
arg "<profile>" help="Explicit measurement profile label"
arg "<baseline>" help="Baseline JSON path (explicitly overwritten)"
flag "--binary <binary>" help="Existing optimized artifact" default="target/release/fino"
'''
run = '''
set -eu
cargo build --release --locked --bin fino --example performance
exec target/release/examples/performance snapshot "${usage_runner?}" "${usage_profile?}" "${usage_baseline?}" --binary "${usage_binary?}"
'''

[tasks."perf:check"]
description = "Compare release measurements with an existing matching baseline; never write it"
usage = '''
arg "<runner>" help="Generic stable runner label matching the baseline"
arg "<profile>" help="Explicit measurement profile matching the baseline"
arg "<baseline>" help="Existing host-specific baseline JSON"
flag "--binary <binary>" help="Existing optimized artifact" default="target/release/fino"
'''
run = '''
set -eu
cargo build --release --locked --bin fino --example performance
exec target/release/examples/performance check "${usage_runner?}" "${usage_profile?}" "${usage_baseline?}" --binary "${usage_binary?}"
'''
