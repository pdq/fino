name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Formatting
            task: fmt-check
            tools: rust dprint
            fetch-depth: 1
          - name: Clippy
            task: clippy
            tools: rust
            fetch-depth: 1
          - name: Tests
            task: test
            tools: rust
            fetch-depth: 1
          - name: Workflow lint
            task: lint:workflows
            tools: jactionlint
            fetch-depth: 1
          - name: Secrets (files)
            task: secrets:files
            tools: betterleaks
            fetch-depth: 1
          - name: Secrets (history)
            task: secrets:history
            tools: betterleaks
            fetch-depth: 0
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ matrix.fetch-depth }}
          persist-credentials: false
      - uses: jdx/mise-action@v5.2.6 # Immutable release verified via GitHub API.
        with:
          install_args: ${{ matrix.tools }}
      - name: Run check
        run: mise run "$MISE_TASK"
        env:
          MISE_TASK: ${{ matrix.task }}
          GH_TOKEN: ${{ github.token }}

  pr-title:
    name: PR title
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5.2.6 # Immutable release verified via GitHub API.
        with:
          install_args: github:crate-ci/committed
      - name: Require a Conventional Commit title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            PR_TITLE=$(gh pr view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json title --jq .title)
          fi
          printf '%s\n' "$PR_TITLE" | committed --config committed.toml --no-merge-commit --no-wip --no-fixup --commit-file -

  platforms:
    name: Build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    env:
      CARGO_BUILD_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5.2.6 # Immutable release verified via GitHub API.
        with:
          install_args: rust
      - name: Install the native Linux musl compiler
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends musl-tools
          echo 'CC=musl-gcc' >> "$GITHUB_ENV"
      - name: Install the target standard library
        env:
          TARGET: ${{ matrix.target }}
        run: rustup target add "$TARGET"
      - run: mise run test
      - run: mise run build:release
