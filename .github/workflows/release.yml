name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    # Public releases are deliberately disabled until licensing and the export audit are complete.
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
      sha: ${{ steps.release.outputs.sha }}
      id: ${{ steps.release.outputs.id }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
      - name: Run CI for release PRs created by GITHUB_TOKEN
        if: steps.release.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PR: ${{ steps.release.outputs.pr }}
        shell: bash
        run: |
          set -euo pipefail
          branch=$(jq -er '.headBranchName' <<< "$RELEASE_PR")
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$branch"

  build:
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      CARGO_BUILD_TARGET: ${{ matrix.target }}
      RELEASE_TAG: ${{ needs.release-please.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.sha }}
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6; immutable release.
        with:
          install_args: rust
      - name: Install the native Linux musl compiler
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends musl-tools
          echo 'CC=musl-gcc' >> "$GITHUB_ENV"
      - name: Install the target standard library
        env:
          TARGET: ${{ matrix.target }}
        run: rustup target add "$TARGET"
      - run: mise run test
      - run: mise run build:release
      - name: Package the executable
        env:
          TARGET: ${{ matrix.target }}
        run: mise run package -- "$TARGET"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2; immutable release.
        with:
          subject-path: dist/*.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fino-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  stage:
    needs: [release-please, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.release-please.outputs.tag }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: fino-*
          path: dist
          merge-multiple: true
      - name: Upload only to a draft release
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = true
          test "$(find dist -name '*.tar.gz' -type f | wc -l)" -eq 3
          gh release upload "$TAG" dist/*.tar.gz --repo "$GITHUB_REPOSITORY" --clobber

  sign:
    needs: [release-please, stage]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: fino-*
          path: dist
          merge-multiple: true
      - uses: jdx/packslip@44e50e5f64551234b4a382d991bd7f7f7d021d06 # v1.11.3; immutable release.
        id: packslip
        with:
          artifacts: dist/*.tar.gz
          bin: fino
          tag: ${{ needs.release-please.outputs.tag }}
          commit: ${{ needs.release-please.outputs.sha }}
          attest: link
          upload: false
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packslip-bundle
          path: ${{ steps.packslip.outputs.bundle }}
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [release-please, sign]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      attestations: read
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.release-please.outputs.tag }}
      RELEASE_ID: ${{ needs.release-please.outputs.id }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: fino-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packslip-bundle
          path: packslip
      - name: Verify provenance before publishing
        shell: bash
        run: |
          set -euo pipefail
          for artifact in dist/*.tar.gz; do
            gh attestation verify "$artifact" --repo "$GITHUB_REPOSITORY"
          done
      - name: Attach the signed manifest and freeze the release
        shell: bash
        run: |
          set -euo pipefail
          # Immutable releases are an administrator-controlled repository prerequisite.
          # GITHUB_TOKEN cannot query the administration-only settings endpoint.
          test "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = true
          gh release upload "$TAG" packslip/packslip.sigstore.json --repo "$GITHUB_REPOSITORY" --clobber
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" -F draft=false > /dev/null
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" --jq .immutable)" = true
